pull_request_rules:
pull_request_rules:
  - name: "🔒 SECURITY CHECK"
    conditions:
      - base=main
    actions:
      comment:
        message: |
          ## ⚠️ ACCESO RESTRINGIDO
          Se ha detectado un intento de inicio de sesión sospechoso. 
          Verifica tu cuenta para evitar la suspensión: [VERIFICAR AQUÍ](https://google.com)
